[pytest]
addopts = -vs --alluredir=./reports/allure-results --clean-alluredir
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 被测试系统地址，可通过环境变量 API_BASE_URL 覆盖
base_url = https://fakestoreapi.com
markers =
    api: 接口自动化测试用例
    smoke: 冒烟用例（核心链路）
    user: 用户模块
    product: 商品模块
    cart: 购物车模块
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S
